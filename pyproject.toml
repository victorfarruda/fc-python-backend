[project]
name = "fc-python-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.9.1",
    "colorama==0.4.6",
    "django==5.0.1",
    "django-utils-six==2.0",
    "djangorestframework==3.16.0",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "pytest==8.4.1",
    "pytest-django==4.11.1",
    "ruff>=0.15.13",
    "six==1.17.0",
    "sqlparse==0.5.3",
    "tzdata==2025.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "src.django_project.settings"
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py",
]
